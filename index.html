<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Compare a resume with a job description and identify matched and missing skills.">
  <title>Job Match Analyzer</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="page-shell">
    <section class="hero" aria-labelledby="page-title">
      <p class="eyebrow">Job Match Analyzer</p>
      <h1 id="page-title">See how your resume fits the role</h1>
      <p class="subtitle">Paste your resume and a job description to prepare a clear skill-match analysis.</p>
    </section>

    <section class="analyzer-card" aria-label="Job match analyzer form">
      <div class="input-grid">
        <div class="field-group">
          <label for="resumeText">Your resume</label>
          <textarea id="resumeText" rows="14" placeholder="Paste your resume text here..."></textarea>
          <p class="field-hint">Your text stays in your browser.</p>
        </div>

        <div class="field-group">
          <label for="jobText">Job description</label>
          <textarea id="jobText" rows="14" placeholder="Paste the job description here..."></textarea>
          <p class="field-hint">Use the full job description for the best analysis.</p>
        </div>
      </div>

      <div class="action-row">
        <button id="analyzeButton" type="button">Analyze Match</button>
        <p id="formMessage" class="form-message" role="status" aria-live="polite"></p>
      </div>
    </section>

    <section id="resultsSection" class="results-card" aria-labelledby="results-title" hidden>
      <h2 id="results-title">Analysis</h2>
      <p id="resultsMessage"></p>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
